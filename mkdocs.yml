site_name: Lakshanand's 314 Data Sheet
site_url: https://embedded-systems-design.github.io/EGR314DataSheetTemplate
repo_url: https://github.com/embedded-systems-design/EGR314DataSheetTemplate
edit_uri: edit/main/docs/
nav:
  - Welcome: index.md
  - 01 Requirements:
      - Requirements: 01-Requirements/Requirements.md
  - 02 Block Diagram:
      - Block Diagram: 02-Block-Diagram/Block-Diagram.md
  - 03 Component Selection:
      - Component Selection: 03-Component-Selection/Component-Selection.md
  - 04 Microcontroller Selection:
      - Microcontroller Selection: 04- Microcontroller Selection/mcs.md
  - 05 Power Budget:
      - Power Budget: 05- Power Budget/power.md
  - 06 BOM:
      - BOM: 06 -BOM/BOM.md
  - 07 Schematic:
      - Schematic: 07 -Schematic/schematic.md
  - 08 PCB:
      - PCB Design: 08 -PCB/pcb.md
  - 09 Reflection:
      - Reflection: 09 -Reflection/Reflection.md
  - 10 API:
      - API & UART Protocol: 10 -API/API.md
  - 11 Hardware V2:
      - Hardware Version 2.0: 11 -Hardware V2/hardwarev2.md
  - 12 Lessons Learned:
      - Lessons Learned: 12 -Lesson Learned/lessonlearned.md
  - 13 Recommendations:
      - Recommendations for Future Students: 13 - Recommendation of Future Students/Recommendation.md
  - 14 Resources:
      - Resources: 14 -Resources/resource.md

theme:
  name: material
  custom_dir: custom_theme/
  palette:
    primary: blue
    accent: indigo
  font:
    text: Roboto
  logo: static/logo314.svg
  favicon: static/logo314.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow    
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - content.action.edit
    - navigation.footer
#    - navigation.sections
#    - navigation.expand
#    - navigation.instant # doesn't work that well

markdown_extensions:
  - attr_list #add attributes using curly brackets to images, see https://squidfunk.github.io/mkdocs-material/reference/images/
  - md_in_html # see https://squidfunk.github.io/mkdocs-material/reference/images/
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

draft_docs: |
  **/*_unpublished.md
  **/*_draft.md
  **/*_draft**
  
plugins:
  - search
  - glightbox # allow resize images, see https://squidfunk.github.io/mkdocs-material/reference/images/

extra_css:
  - stylesheets/extra.css  

extra_javascript:
 - javascripts/mathjax.js
 - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    
not_in_nav: |
  static
  
copyright: "Copyright &copy; 2026 team-name-here"

extra:
  generator: false
  social:
    - icon: fontawesome/regular/file-code
      link: /2026_spring
      name: 2023 Site    
