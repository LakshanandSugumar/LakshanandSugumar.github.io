site_name: "Siemens S7-1500 Production Cell \u00b7 Lakshanand Sugumar"
site_description: "Three-station simulated assembly cell on a Siemens S7-1500: SICAR-style S7-GRAPH sequences, interlocks, WinCC HMI, Factory I/O, and an OPC UA collector with a Streamlit OEE, Pareto and MTBF/MTTR dashboard."
site_url: https://lakshanandsugumar.github.io/projects/siemens-production-cell/
repo_url: https://github.com/LakshanandSugumar/siemens-production-cell
repo_name: Source code

theme:
  name: material
  custom_dir: custom_theme/
  logo: static/logo.svg
  favicon: static/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.tabs.link
    - content.code.copy
nav:
  - "Home": index.md
  - "Simulation Run": simulation-run.md
  - "Cell Design":
    - "Cell & I/O": design/cell-and-io.md
    - "S7-GRAPH Sequences": design/sequences.md
    - "Modes & Interlocks": design/modes-and-interlocks.md
    - "HMI Spec": design/hmi.md
    - "OPC UA Interface": design/opcua.md
  - "Software":
    - "Mock PLC & Simulator": software/simulator.md
    - "Dashboard & Data": software/dashboard.md
    - "Troubleshooting": software/troubleshooting.md
  - "TIA Build Plan": build-plan.md
  - "More":
    - "Research Ideas": research-ideas.md
    - "Changelog": changelog.md
markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

not_in_nav: |
  static
copyright: "Copyright &copy; 2026 Lakshanand Sugumar · Arizona State University, Polytechnic · <a href=\"https://www.lakshanand.dev\">lakshanand.dev</a>"
extra:
  generator: false
  social:
    - icon: material/web
      link: https://www.lakshanand.dev
      name: Portfolio
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/lakshanand-sugumar
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/LakshanandSugumar
      name: GitHub
