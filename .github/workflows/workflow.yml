# derived from 
#<https://github.com/marketplace/actions/mkdocs-action>
#<https://gist.github.com/liflovs/f2a950dadcca25a0dbdfe10f53f5c838>
#<https://stackoverflow.com/questions/64374179/how-to-push-to-another-repository-in-github-actions>
#<https://stackoverflow.com/questions/41714882/git-how-to-clone-with-ssh-key-username>

name: mkdocs-build

on:
  push:
    branches:
      - main

jobs:

  build:
    name: build mkdocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Build
        uses: Tiryoh/actions-mkdocs@v0
        with:
          mkdocs_version: 'latest' # latest means latest for the base ubuntu image.  You should peg it to a specific version for best results.
          # mkdocs_version: '1.6' # option
          requirements: 'requirements.txt' # option
          configfile: 'mkdocs.yml' # option

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build project sites
        run: |
          sudo chown -R "$(id -u):$(id -g)" site
          python -m pip install -r projects/requirements.txt
          (cd projects/_hub && mkdocs build -d ../../site/projects)
          for d in projects/*/; do
            n=$(basename "$d")
            [ "$n" = "_hub" ] && continue
            (cd "$d" && mkdocs build -d "../../site/projects/$n")
          done

      - name: Combine project sitemaps
        run: |
          python - <<'PY'
          import glob, re, datetime
          urls = []
          for f in sorted(glob.glob("site/projects/*/sitemap.xml")) + ["site/projects/sitemap.xml"]:
              urls += re.findall(r"<loc>([^<]+)</loc>", open(f).read())
          today = datetime.date.today().isoformat()
          body = "".join(f"  <url><loc>{u}</loc><lastmod>{today}</lastmod></url>\n" for u in dict.fromkeys(urls))
          open("site/projects/sitemap.xml", "w").write('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' + body + "</urlset>\n")
          print(len(urls), "urls")
          PY

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site          
          allow_empty_commit: true

